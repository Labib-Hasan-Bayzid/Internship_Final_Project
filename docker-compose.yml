services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dcv
      POSTGRES_USER: dcv
      POSTGRES_PASSWORD: dcv
    ports:
      - "5432:5432"
    volumes:
      - dcv_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcv -d dcv"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://dcv:dcv@postgres:5432/dcv
      K8S_ENABLED: "false"
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_MODEL: "${AI_MODEL:-gpt-5}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_PRIVATE_KEY: "${GITHUB_PRIVATE_KEY:-}"
      GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET:-}"
      GITHUB_API_VERSION: "${GITHUB_API_VERSION:-2026-03-10}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      STRIPE_PRICE_TEAM: "${STRIPE_PRICE_TEAM:-}"
      STRIPE_PRICE_BUSINESS: "${STRIPE_PRICE_BUSINESS:-}"
      STRIPE_SUCCESS_URL: "${STRIPE_SUCCESS_URL:-http://localhost:3000/?billing=success}"
      STRIPE_CANCEL_URL: "${STRIPE_CANCEL_URL:-http://localhost:3000/?billing=cancel}"
      BILLING_PORTAL_RETURN_URL: "${BILLING_PORTAL_RETURN_URL:-http://localhost:3000}"
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  dcv_postgres:
