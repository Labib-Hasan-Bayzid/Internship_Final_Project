apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: dependency-change-verification
  namespace: argocd
spec:
  description: Dependency Change Verification production workloads
  sourceRepos:
    - https://github.com/OWNER/dependency-change-verification.git
  destinations:
    - namespace: dcv
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ResourceQuota
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
