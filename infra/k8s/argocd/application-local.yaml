apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dependency-change-verification-local
  namespace: argocd
spec:
  project: dependency-change-verification
  source:
    repoURL: https://github.com/OWNER/dependency-change-verification.git
    targetRevision: main
    path: infra/k8s/local
  destination:
    server: https://kubernetes.default.svc
    namespace: dcv
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: true
      allowEmpty: false
    retry:
      limit: 3
      refresh: true
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
