apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: dcv
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: dcv-postgres
  template:
    metadata:
      labels:
        app: dcv-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: dcv
            - name: POSTGRES_USER
              value: dcv
            - name: POSTGRES_PASSWORD
              value: dcv
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U dcv -d dcv"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U dcv -d dcv"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
