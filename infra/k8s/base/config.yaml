apiVersion: v1
kind: ConfigMap
metadata:
  name: dcv-config
  namespace: dcv
data:
  APP_PUBLIC_URL: "http://localhost:3000"
  CORS_ORIGINS: "http://localhost:3000"
  ENVIRONMENT: "production"
  K8S_ENABLED: "true"
  K8S_NAMESPACE: "dcv-runs"
  K8S_JOB_TIMEOUT_SECONDS: "600"
  AI_ENABLED: "false"
  AI_AUTO_EXPLAIN: "true"
  AI_MODEL: "gpt-5"
  GITHUB_API_URL: "https://api.github.com"
  GITHUB_API_VERSION: "2026-03-10"
  GITHUB_AUTO_VERIFY: "true"
  GITHUB_PR_COMMENTS: "true"
  GITHUB_REQUEST_TIMEOUT_SECONDS: "30"
  GITHUB_MAX_RETRIES: "3"
  GITHUB_APP_SLUG: ""
  STRIPE_SUCCESS_URL: "http://localhost:3000/?billing=success"
  STRIPE_CANCEL_URL: "http://localhost:3000/?billing=cancel"
  BILLING_PORTAL_RETURN_URL: "http://localhost:3000"
  STRIPE_PRICE_TEAM: ""
  STRIPE_PRICE_BUSINESS: ""
  DEFAULT_ORG_NAME: "Local Organization"
  DEFAULT_ORG_SLUG: "local"
  DEV_IDENTITY_EMAIL: "owner@local.dcv"
  DEV_IDENTITY_NAME: "Local Owner"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: runner-policy-notes
  namespace: dcv
data:
  policy: "non-root;drop-all-capabilities;no-service-account-token;runtime-default-seccomp;resource-limits"
