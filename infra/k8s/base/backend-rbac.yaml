apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcv-backend
  namespace: dcv
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcv-job-manager
  namespace: dcv-runs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcv-backend-job-manager
  namespace: dcv-runs
subjects:
  - kind: ServiceAccount
    name: dcv-backend
    namespace: dcv
roleRef:
  kind: Role
  name: dcv-job-manager
  apiGroup: rbac.authorization.k8s.io
