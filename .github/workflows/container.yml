name: Container Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "infra/k8s/production/kustomization.yaml"
  workflow_dispatch:

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    name: Release quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dcv_test
          POSTGRES_USER: dcv
          POSTGRES_PASSWORD: dcv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcv -d dcv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend compile and tests
        env:
          DATABASE_URL: postgresql+psycopg://dcv:dcv@localhost:5432/dcv_test
          K8S_ENABLED: "false"
          DEV_IDENTITY_BOOTSTRAP: "true"
        run: |
          python -m pip install -r backend/requirements.txt
          python -m compileall -q backend/app backend/tests runner/python
          pytest -q backend/tests --junitxml=backend-release-test-results.xml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Frontend build
        working-directory: frontend
        env:
          BACKEND_INTERNAL_URL: http://backend:8000
        run: npm install --no-audit --no-fund && npm run build
      - uses: azure/setup-kubectl@v5
        with:
          version: v1.37.0
      - name: Render Kubernetes overlays
        run: |
          kubectl kustomize infra/k8s/local >/tmp/dcv-local.yaml
          kubectl kustomize infra/k8s/production >/tmp/dcv-production.yaml
          test -s /tmp/dcv-local.yaml
          test -s /tmp/dcv-production.yaml
      - name: Upload backend test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-release-backend-tests
          path: backend-release-test-results.xml
          if-no-files-found: ignore

  publish:
    name: Build and publish images
    needs: quality-gate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            image: dependency-change-verification-backend
          - name: frontend
            context: ./frontend
            image: dependency-change-verification-frontend
          - name: runner-python
            context: ./runner/python
            image: dependency-change-verification-runner-python
          - name: runner-node
            context: ./runner/node
            image: dependency-change-verification-runner-node
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  pin-production:
    name: Pin production GitOps revision
    permissions:
      contents: write
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Pin production images to immutable commit SHA
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, re
          p = Path('infra/k8s/production/kustomization.yaml')
          s = p.read_text()
          s = s.replace('ghcr.io/OWNER/', f"ghcr.io/{os.environ['OWNER']}/")
          s = re.sub(r'newTag: .*', f"newTag: sha-{os.environ['SHA']}", s)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/k8s/production/kustomization.yaml
          git commit -m "chore(gitops): pin images to $SHA [skip ci]" || exit 0
          git push
