name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: dcv_test
          POSTGRES_USER: dcv
          POSTGRES_PASSWORD: dcv
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dcv -d dcv_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Compile
        run: python -m compileall -q backend/app backend/tests
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://dcv:dcv@localhost:5432/dcv_test
          K8S_ENABLED: "false"
        run: pytest -q --junitxml=test-results.xml
      - name: Publish test report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        working-directory: frontend
        shell: bash
        run: |
          npm install --no-audit --no-fund
      - name: Build
        working-directory: frontend
        env:
          BACKEND_INTERNAL_URL: http://backend:8000
        run: npm run build

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.37.0
      - name: Render local overlay
        run: kubectl kustomize infra/k8s/local >/tmp/dcv-local.yaml
      - name: Render production overlay
        run: kubectl kustomize infra/k8s/production >/tmp/dcv-production.yaml

  container-build:
    name: Validate container builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
          - name: runner-python
            context: ./runner/python
          - name: runner-node
            context: ./runner/node
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          tags: dcv/${{ matrix.name }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.name }}

  powershell-scripts:
    name: PowerShell script syntax
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Parse scripts
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path scripts -Filter *.ps1 -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              foreach ($err in $parseErrors) {
                $allErrors += "$($_.Name):$($err.Extent.StartLineNumber): $($err.Message)"
              }
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host "All PowerShell scripts parse successfully."

